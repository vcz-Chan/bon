name: CI/CD Pipeline - Build and Deploy bone

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/bone
          docker build -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/bone

            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            docker stop bone || true
            docker rm bone || true

            docker pull $IMAGE_NAME:latest

            docker run -d --name bone -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e OPENAI_BASE_URL="${{ secrets.OPENAI_BASE_URL }}" \
              -e LLM_MODEL="${{ secrets.LLM_MODEL }}" \
              -e EMBEDDING_MODEL="${{ secrets.EMBEDDING_MODEL }}" \
              -e EMBEDDING_DIM="${{ secrets.EMBEDDING_DIM }}" \
              -e RAG_TOP_K="${{ secrets.RAG_TOP_K }}" \
              -e RAG_MIN_SCORE="${{ secrets.RAG_MIN_SCORE }}" \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              -e USER_PASSWORD="${{ secrets.USER_PASSWORD }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              $IMAGE_NAME:latest
